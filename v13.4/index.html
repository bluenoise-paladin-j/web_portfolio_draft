<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No theme-colour meta, on purpose. A single value tints the top and
     the bottom chrome the SAME colour. With none set, Safari samples the
     page at each edge and picks them up separately, which is what the two
     ends want here: the white name band above,
     the red statement band below. -->
<title>Jared Amuso — Home</title>
<!-- Start the faces this page uses downloading now, during HTML parse,
     rather than after the browser has fetched the CSS, parsed it and
     worked out which families the render tree needs. Only the faces
     this page actually uses. -->
<link rel="preload" href="fonts/VJAMAI.TTF" as="font" type="font/ttf" crossorigin>  <!-- Jamai -->
<link rel="preload" href="fonts/VSWISEC.TTF" as="font" type="font/ttf" crossorigin>  <!-- Swiss -->
<link rel="preload" href="fonts/VBANDIT.TTF" as="font" type="font/ttf" crossorigin>  <!-- Bandit -->
<link rel="stylesheet" href="css/style.css">
<script>document.documentElement.classList.add('js');</script>
</head>

<!-- HOME — five bands filling the viewport.
     --grow sets each band's share of the height,
     --bg / --fg its colours, --ff its typeface. -->
<body class="home">

  <div class="band" style="--grow:var(--g1); --bg:var(--white); --fg:var(--black); --ff:var(--f-jamai);">
    <span class="marquee">JARED AMUSO</span>
  </div>

  <a href="works.html" class="band band--link" style="--grow:var(--g2); --bg:var(--red); --fg:var(--white); --ff:var(--f-swiss);">
    <span class="marquee" data-dir="rtl">WORKS</span>
  </a>

  <a href="about.html" class="band band--link" style="--grow:var(--g3); --bg:var(--blue); --fg:var(--white); --ff:var(--f-bandit);">
    <span class="marquee">ABOUT</span>
  </a>

  <div class="band" style="--grow:var(--g4); --bg:var(--white); --fg:var(--red); --ff:var(--f-swiss);">
    <span class="marquee" data-dir="rtl">INTERACTION + INSTALLATION + MOTION</span>
  </div>

  <div class="band" style="--grow:var(--g5); --bg:var(--red); --fg:var(--green); --ff:var(--f-swiss);">
    <span class="marquee">THROUGH PROCESS-DRIVEN EXPERIMENTATION IN INTERACTIVE MEDIA AND VIRTUAL ENVIRONMENTS, MY WORK EXPLORES HOW DIGITAL SYSTEMS CAN GENERATE MEANINGFUL AFFECTIVE EXPERIENCES.</span>
  </div>

  <!-- The QR is a square exactly as tall as the three bands below WORKS.
       Its size comes from --qr-size on .home, which is the sum of those
       three weights, so it stays locked to them. Home only, and desktop
       and tablet only — the point of it is to get the site onto a phone,
       which is redundant once you are on one. -->
  <aside class="qr"><img src="img/qr.svg" alt="QR code linking to this site"></aside>

<script src="js/main.js"></script>
</body>
</html>
